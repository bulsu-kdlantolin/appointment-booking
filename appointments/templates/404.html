{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Appointment Booking</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
  <nav class="border-b border-slate-200 bg-white shadow-sm">
      <div class="mx-auto max-w-5xl px-4 py-3.5 sm:px-6">
        <a href="{% url 'appointments:list' %}"
          class="flex items-center gap-3 text-lg font-bold tracking-tight text-slate-900 transition hover:opacity-90">
          <img src="{% static 'images/logo.svg' %}" alt="Appointment Booking Logo" class="h-8 w-8 shrink-0">
          <span>Appointment Booking</span>
        </a>
      </div>
  </nav>
  <main class="mx-auto flex max-w-5xl justify-center px-4 py-16 sm:px-6 sm:py-24">
    <section class="w-full max-w-xl rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm sm:p-12">
      <div
        class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-red-50 text-2xl font-bold text-red-600">
        ?</div>
      <p class="mb-2 text-sm font-bold uppercase tracking-widest text-red-600">Error 404</p>
      <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Page not found</h1>
      <p class="mx-auto mt-3 max-w-md leading-7 text-slate-500">The page you are looking for may have moved, been
        removed, or never existed.</p>
      <a href="{% url 'appointments:list' %}"
        class="mt-8 inline-flex rounded-xl bg-red-600 px-5 py-3 font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-200">Return
        to appointments</a>
    </section>
  </main>
</body>

</html>
