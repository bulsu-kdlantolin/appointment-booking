{% load i18n unfold_list %}

{% if cl.has_filters and cl|unfold_vertical_filters|length > 0 %}
<button type="button"
    class="filter-open-button {% if cl.has_active_filters %}bg-primary-600 border-primary-600 text-white{% else %}bg-white border-base-200 hover:text-primary-600 dark:bg-base-900 dark:border-base-700 dark:hover:text-primary-500{% endif %} border cursor-pointer flex font-medium gap-2.5 group items-center px-3.5 py-2 rounded-default shadow-xs text-sm transition-colors"
    x-bind:class="{ '!bg-primary-50 !border-primary-400 !text-primary-700 dark:!bg-primary-950/40 dark:!border-primary-600 dark:!text-primary-300': filterOpen }"
    x-on:click="filterOpen = !filterOpen" x-on:keydown.escape.window="filterOpen = false" title="Toggle filters">
    <span class="material-symbols-outlined text-[18px]">filter_list</span>
    <span>{% trans "Filters" %}</span>
    <span class="material-symbols-outlined text-[18px] transition-transform duration-200"
        x-bind:class="{ 'rotate-180': filterOpen }">expand_more</span>
</button>
{% endif %}
