{% load admin_list %}

{% if actions_on_top %}
    {% if cl.search_fields or action_form or cl.has_filters %}
        <div class="fixed bottom-14 right-10 z-50 hidden group-has-[input.action-select:checked]:flex items-center" style="right: 2.5rem; bottom: 3.5rem;">
            <div id="changelist-actions-wrapper" class="group changelist-actions">
                {% if action_form %}
                    {% admin_actions %}
                {% endif %}
            </div>
        </div>
    {% endif %}
{% endif %}
