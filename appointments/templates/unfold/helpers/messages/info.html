<div class="message-info mb-3 px-3.5 py-2.5 leading-[18px] rounded-default bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-400 flex items-center justify-between gap-3 {% if class %} {{ class }}{% endif %}">
    <div class="grow flex items-center gap-2.5">
        <span class="material-symbols-outlined text-[18px] text-blue-600 dark:text-blue-400 select-none shrink-0">info</span>
        <span>{{ message }}</span>
    </div>
    <button type="button"
            onclick="(function(btn){ var target = btn.closest('li') || btn.closest('.message-info'); if(target){ target.classList.add('error-dismiss-target', 'error-dismissing'); setTimeout(function(){ target.style.display='none'; }, 400); } })(this)"
            class="text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-200 cursor-pointer p-0.5 rounded transition-colors select-none flex items-center justify-center"
            title="Dismiss">
        <span class="material-symbols-outlined text-[16px]">close</span>
    </button>
</div>
